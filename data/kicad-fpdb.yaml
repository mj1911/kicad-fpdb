# We will generalize all of the package families that we can.  Some families are
# vendor-specific, and we will end up with some families only matching one 
# vendor, which is fine.  We may also find that two vendor's footprints can be
# very similar - in that case, we should consider merging them.
DIP:
  generator: dual_row_grid
  variant_param: pin_count
  variants: {n: narrow, r: regular, w: wide}
  default_width: narrow
  params:
    pitch: 2.54
    row_spacing: {narrow: 7.62, regular: 10.16, wide: 15.24}
    body_width: {narrow: 5.3, regular: 6.47, wide: 12.92}
    body_margin: 1.33
    courtyard_margin_x: 0.25
    courtyard_margin_y: 0.72
    notch_radius: 1.0
    pin1_marker: false
    fab_body_width: {narrow: 6.35, regular: 6.35, wide: 14.73}
    fab_body_margin: 1.27
    fab_chamfer: 1.0
    fab_reference_rotation: 90
    pad_size: [1.6, 1.6]
    pad_shape: dip_pin1_marker
    pad_type: thru_hole
    drill: 0.8
    centered: false

# SOIC is expected to also have narrow and wide variants.
# There are even a few odd ones, with 7 or 12 pins - different generator.
SOIC:
  generator: dual_row_grid
  variant_param: pin_count
  params:
    pitch: 1.27
    row_spacing: 4.95
    body_width: 4.12
    body_margin: 0.64
    silk_two_lines: true
    courtyard_margin_x: 0.25
    courtyard_margin_y: 0.25
    courtyard_body_width: 3.9
    courtyard_body_margin: 0.545
    fab_outline: true
    fab_chamfer: 0.975
    fab_reference_rotation: 90
    pad_size: [1.95, 0.6]
    pad_shape: roundrect
    pad_type: smd
    centered: true

# Note we've only seen SMT resistors so far... there's also TH variants.
# Since two_pad_chip is going to apply to almost all resistors, can we move
# that to params, and only call a different generator if needed?
R:
  params:
    pin1_marker: false
  children:
    R-0201:
      generator: two_pad_chip
      params: {pad_pitch: 0.64, pad_size: [0.46, 0.4], no_silk: true, courtyard_margin_x: 0.15, courtyard_margin_y: 0.15, fab_body_size: [0.6, 0.3], fab_reference_font_size: 0.25, fab_reference_thickness: 0.04}
    R-0402:
      generator: two_pad_chip
      params: {pad_pitch: 1.02, pad_size: [0.54, 0.64], silk_y: 0.38, silk_half_length: 0.153641, courtyard_margin_x: 0.15, courtyard_margin_y: 0.15, fab_body_size: [1.05, 0.54], fab_reference_font_size: 0.26, fab_reference_thickness: 0.04}
    R-0603:
      generator: two_pad_chip
      params: {pad_pitch: 1.65, pad_size: [0.8, 0.95], silk_y: 0.5225, silk_half_length: 0.237258, courtyard_margin_x: 0.25, courtyard_margin_y: 0.25, fab_body_size: [1.6, 0.825], fab_reference_font_size: 0.4, fab_reference_thickness: 0.06}
    R-0805:
      generator: two_pad_chip
      params: {pad_pitch: 1.825, pad_size: [1.025, 1.4], silk_y: 0.735, silk_half_length: 0.227064, courtyard_margin_x: 0.25, courtyard_margin_y: 0.25, fab_body_size: [2, 1.25], fab_reference_font_size: 0.5, fab_reference_thickness: 0.08}
    R-1206:
      generator: two_pad_chip
      params: {pad_pitch: 2.925, pad_size: [1.125, 1.75], silk_y: 0.91, silk_half_length: 0.727064, courtyard_margin_x: 0.25, courtyard_margin_y: 0.25, fab_body_size: [3.2, 1.6], fab_reference_font_size: 0.8, fab_reference_thickness: 0.12}

# Capacitors can be SMT or TH, this needs consideration.
# They can also be non-polarized (most) or polarized.
# The vast majority will be two-pin though, so repeating
# `generator: two_pad_chip` for each one could be wasteful.
C:
  params:
    pin1_marker: false
  children:
    C-0402:
      generator: two_pad_chip
      params: {pad_pitch: 0.96, pad_size: [0.56, 0.62], silk_y: 0.36, silk_half_length: 0.107836, courtyard_margin_x: 0.15, courtyard_margin_y: 0.15, fab_body_size: [1.0, 0.5], fab_reference_font_size: 0.25, fab_reference_thickness: 0.04}
    C-0603:
      generator: two_pad_chip
      params: {pad_pitch: 1.55, pad_size: [0.9, 0.95], silk_y: 0.51, silk_half_length: 0.14058, courtyard_margin_x: 0.25, courtyard_margin_y: 0.25, fab_body_size: [1.6, 0.8], fab_reference_font_size: 0.4, fab_reference_thickness: 0.06}
    C-0805:
      generator: two_pad_chip
      params: {pad_pitch: 1.9, pad_size: [1, 1.45], silk_y: 0.735, silk_half_length: 0.261252, courtyard_margin_x: 0.25, courtyard_margin_y: 0.25, fab_body_size: [2, 1.25], fab_reference_font_size: 0.5, fab_reference_thickness: 0.08}

# QFP is enumerated per-variant below rather than formula-driven like DIP/
# SOIC: quad_perimeter's pad_offset depends on body size, which isn't
# derivable from pin_count alone with the parameters this family currently
# declares. Follow-up work could add a declared body-size parameter and
# derive pad_offset from it to make QFP formula-driven like the others.
# Like resistors, it is likely that all QFP's will use 'quad_perimeter'.'
QFP:
  params:
    body_size: 7.22
    courtyard_margin_x: 0.25
    courtyard_margin_y: 0.25
    courtyard_body_size: 7.0
    fab_outline: true
    fab_chamfer: 1.0
  children:
    QFP-32:
      generator: quad_perimeter
      params: {pin_count: 32, pitch: 0.8, pad_offset: 4.175, pad_size: [1.5, 0.5]}
    QFP-48:
      generator: quad_perimeter
      params: {pin_count: 48, pitch: 0.5, pad_offset: 4.1625, pad_size: [1.475, 0.3]}

# SOT-23's asymmetric pin layouts (2+1, 3+2, 3+3, 4+4) don't follow a
# pin_count formula -- SOT-23-5's right column uses only the outer two
# positions of a shared 3-position lead-frame grid rather than being
# independently re-centered, so each variant declares explicit
# left_offsets/right_offsets. silk_segments is a verbatim copy of each
# real reference footprint's notched-body silk shape (see
# docs/superpowers/specs/2026-09-15-sot23-family-design.md) -- no
# shared formula, same convention as chip-passive silk_y/silk_half_length.
SOT:
  generator: asymmetric_dual_row
  params:
    pad_shape: roundrect
    pad_type: smd
    courtyard_margin_x: 0.25
    courtyard_margin_y: 0.25
    fab_outline: true
    fab_reference_font_size: 0.72
    fab_reference_thickness: 0.11
    fab_reference_rotation: 90
  children:
    SOT-23:
      params:
        left_offsets: [-0.95, 0.95]
        right_offsets: [0]
        row_spacing: 1.875
        pad_size: [1.475, 0.6]
        pin1_marker: false
        courtyard_body_size: [1.3, 2.9]
        fab_chamfer: 0.325
        silk_segments:
          - [[-0.76, -1.56], [0.76, -1.56]]
          - [[-0.76, -1.51], [-0.76, -1.56]]
          - [[-0.76, 0.39], [-0.76, -0.39]]
          - [[-0.76, 1.56], [-0.76, 1.51]]
          - [[0.76, -1.56], [0.76, -0.56]]
          - [[0.76, 0.56], [0.76, 1.56]]
          - [[0.76, 1.56], [-0.76, 1.56]]
    # SOT-23-5/6/8 additionally share the same MO-178 lead-frame grid
    # (row_spacing), true body, and fab chamfer -- grouped under this
    # intermediate node (never itself a valid descriptor) so those
    # three values aren't repeated per variant.
    SOT-23-5-6-8:
      params:
        row_spacing: 2.275
        courtyard_body_size: [1.6, 2.9]
        fab_chamfer: 0.4
      children:
        SOT-23-5:
          params:
            left_offsets: [-0.95, 0, 0.95]
            right_offsets: [0.95, -0.95]
            pad_size: [1.325, 0.6]
            pin1_marker: false
            silk_segments:
              - [[-0.91, -1.56], [0.91, -1.56]]
              - [[-0.91, -1.51], [-0.91, -1.56]]
              - [[-0.91, 1.56], [-0.91, 1.51]]
              - [[0.91, -1.56], [0.91, -1.51]]
              - [[0.91, -0.39], [0.91, 0.39]]
              - [[0.91, 1.51], [0.91, 1.56]]
              - [[0.91, 1.56], [-0.91, 1.56]]
        SOT-23-6:
          params:
            left_offsets: [-0.95, 0, 0.95]
            right_offsets: [0.95, 0, -0.95]
            pad_size: [1.325, 0.6]
            silk_segments:
              - [[-0.91, -1.56], [0.91, -1.56]]
              - [[-0.91, -1.51], [-0.91, -1.56]]
              - [[-0.91, 1.56], [-0.91, 1.51]]
              - [[0.91, -1.56], [0.91, -1.51]]
              - [[0.91, 1.51], [0.91, 1.56]]
              - [[0.91, 1.56], [-0.91, 1.56]]
        SOT-23-8:
          params:
            left_offsets: [-0.975, -0.325, 0.325, 0.975]
            right_offsets: [0.975, 0.325, -0.325, -0.975]
            pad_size: [1.325, 0.5]
            silk_segments:
              - [[-0.91, -1.56], [0.91, -1.56]]
              - [[-0.91, -1.485], [-0.91, -1.56]]
              - [[-0.91, 1.56], [-0.91, 1.485]]
              - [[0.91, -1.56], [0.91, -1.485]]
              - [[0.91, 1.485], [0.91, 1.56]]
              - [[0.91, 1.56], [-0.91, 1.56]]
