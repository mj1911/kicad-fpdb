# SOT-23's asymmetric pin layouts (2+1, 3+2, 3+3, 4+4) don't follow a
# pin_count formula -- SOT-23-5's right column uses only the outer two
# positions of a shared 3-position lead-frame grid rather than being
# independently re-centered, so each variant declares explicit
# left_offsets/right_offsets. silk_segments is a verbatim copy of each
# real reference footprint's notched-body silk shape (see
# docs/superpowers/specs/2026-09-15-sot23-family-design.md) -- no
# shared formula, same convention as chip-passive silk_y/silk_half_length.
SOT:
  generator: asymmetric_dual_row
  params: &sot_common_params
    pad_shape: roundrect
    pad_type: smd
    courtyard_margin_x: 0.25
    courtyard_margin_y: 0.25
    fab_outline: true
    fab_reference_font_size: 0.72
    fab_reference_thickness: 0.11
    fab_reference_rotation: 90
  children:
    SOT-23:
      params:
        left_offsets: [-0.95, 0.95]
        right_offsets: [0]
        row_spacing: 1.875
        pad_size: [1.475, 0.6]
        pin1_marker: false
        courtyard_body_size: [1.3, 2.9]
        fab_chamfer: 0.325
        silk_segments:
          - [[-0.76, -1.56], [0.76, -1.56]]
          - [[-0.76, -1.51], [-0.76, -1.56]]
          - [[-0.76, 0.39], [-0.76, -0.39]]
          - [[-0.76, 1.56], [-0.76, 1.51]]
          - [[0.76, -1.56], [0.76, -0.56]]
          - [[0.76, 0.56], [0.76, 1.56]]
          - [[0.76, 1.56], [-0.76, 1.56]]
    # SOT-23-5/6/8 additionally share the same MO-178 lead-frame grid
    # (row_spacing), true body, and fab chamfer -- grouped under this
    # intermediate node (never itself a valid descriptor) so those
    # three values aren't repeated per variant.
    SOT-23-5-6-8: &sot_23_5_6_8
      params: &sot_5_6_8_shared
        row_spacing: 2.275
        courtyard_body_size: [1.6, 2.9]
        fab_chamfer: 0.4
        pin1_marker_style: triangle
        pin1_triangle_axis: y
        pin1_triangle_size: small
        pin1_triangle_anchor_mm: 0.65
      children:
        SOT-23-5:
          params: &sot23_5_params
            left_offsets: [-0.95, 0, 0.95]
            right_offsets: [0.95, -0.95]
            pad_size: [1.325, 0.6]
            pin1_marker: false
            silk_segments:
              - [[-0.91, -1.56], [0.91, -1.56]]
              - [[-0.91, -1.51], [-0.91, -1.56]]
              - [[-0.91, 1.56], [-0.91, 1.51]]
              - [[0.91, -1.56], [0.91, -1.51]]
              - [[0.91, -0.39], [0.91, 0.39]]
              - [[0.91, 1.51], [0.91, 1.56]]
              - [[0.91, 1.56], [-0.91, 1.56]]
        SOT-23-6:
          params: &sot23_6_params
            left_offsets: [-0.95, 0, 0.95]
            right_offsets: [0.95, 0, -0.95]
            pad_size: [1.325, 0.6]
            silk_segments:
              - [[-0.91, -1.56], [0.91, -1.56]]
              - [[-0.91, -1.51], [-0.91, -1.56]]
              - [[-0.91, 1.56], [-0.91, 1.51]]
              - [[0.91, -1.56], [0.91, -1.51]]
              - [[0.91, 1.51], [0.91, 1.56]]
              - [[0.91, 1.56], [-0.91, 1.56]]
        SOT-23-8:
          params: &sot23_8_params
            left_offsets: [-0.975, -0.325, 0.325, 0.975]
            right_offsets: [0.975, 0.325, -0.325, -0.975]
            pad_size: [1.325, 0.5]
            silk_segments:
              - [[-0.91, -1.56], [0.91, -1.56]]
              - [[-0.91, -1.485], [-0.91, -1.56]]
              - [[-0.91, 1.56], [-0.91, 1.485]]
              - [[0.91, -1.56], [0.91, -1.485]]
              - [[0.91, 1.485], [0.91, 1.56]]
              - [[0.91, 1.56], [-0.91, 1.56]]
# TSOT-23-5/6/8 are byte-identical geometry to SOT-23-5/6/8 (verified by
# diffing the real reference footprints: only name/descr/tags/3D-model
# path differ), so they're declared here by YAML-aliasing the exact
# same param mappings rather than repeating them. TSOT-23 (the base
# 3-pin variant) is a *different*, hand-authored footprint with its own
# geometry -- not covered here; see CLAUDE.md TODO.
TSOT:
  generator: asymmetric_dual_row
  params: *sot_common_params
  children:
    TSOT-23-5-6-8:
      params: *sot_5_6_8_shared
      children:
        TSOT-23-5:
          params: *sot23_5_params
        TSOT-23-6:
          params: *sot23_6_params
        TSOT-23-8:
          params: *sot23_8_params
