[project]
name = "kicad-fpdb"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["kicad_fpdb*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
